packages:
  - ./

# pnpm 11 のサプライチェーン保護はデフォルトで有効
# (https://pnpm.io/blog/releases/11.0):
#   - minimumReleaseAge: 1440 (= 1 day) — 公開直後の悪意あるバージョンを遮断
#   - strictDepBuilds: true             — postinstall などのライフサイクル実行を遮断
#   - blockExoticSubdeps: true          — git URL 等の非標準ソースを間接依存に許可しない
# 以下は既定値の上に追加で固める設定。
#
# minimumReleaseAgeStrict: 制約を満たすバージョンが無いときに resolve を失敗させ、
#   古いバージョンへフォールバックしない (デフォルトの「黙って妥協」を禁止)。
minimumReleaseAgeStrict: true
# ワークスペース全体でサプライチェーン保護水準を統一 (agent-assets#171、2026-08-14決定)。
# 既定の1日 (1440分) から3日 (4320分) へ明示的に固定する。
minimumReleaseAge: 4320
# trustPolicy: no-downgrade は本来追加で入れたいが、現状 Astro が依存する
# `chokidar@4.0.3` が過去版で持っていた provenance attestation を落としているため
# 全件 install が落ちる。依存側で provenance が復活したら有効化する。

# v11 で onlyBuiltDependencies / ignoredBuiltDependencies は allowBuilds に統合された。
# esbuild / sharp は astro が transitively 依存するが、build スクリプト実行は不要。
allowBuilds:
  esbuild: false
  lefthook: true
  sharp: false

# v11 では overrides / peerDependencyRules は pnpm-workspace.yaml に置く
# (package.json#pnpm からの移動)。
overrides:
  # rollup@<4.59.0 override は Astro 7 (Vite 8) で削除 — Vite 8 は rollup を rolldown に置き換え、
  # rollup は依存ツリーから消滅したため override が dead になった (2026-06-26)。
  "picomatch@<2.3.2": ">=2.3.2"
  "yaml@>=2.0.0 <2.8.3": ">=2.8.3"
  # GHSA-fxqj-rqcc-2cmp (postcss <8.5.23) — `from` 未設定時に攻撃者制御の sourceMappingURL から
  # 任意の .map ファイルを読み込める。vite 経由で devDependency ツリーに存在。
  "postcss@<8.5.23": ">=8.5.23"
  # GHSA-g7r4-m6w7-qqqr / GHSA-dhv9 (esbuild <0.28.1) — ^0.28.1 で 0.x に固定 (>=0.28.1 は 1.x 以上も含んでしまうため)
  "esbuild@<0.28.1": "^0.28.1"
  # GHSA-9wv6-86v2-598j (path-to-regexp 6.x <6.3.0) — ^6.3.0 で 6.x に固定 (>=6.3.0 は 8.x も含んでしまうため)
  "path-to-regexp@>=6.0.0 <6.3.0": "^6.3.0"
  # tar <7.5.21 (GHSA-r292-9mhp-454m) — @astrojs/vercel>@vercel/nft>@mapbox/node-pre-gyp 経由。
  # 7.x 内に固定。upstream が修正版を取り込んだら削除する。
  "tar@<7.5.21": ">=7.5.21 <8"
  # js-yaml <4.2.0 (merge key 処理の二次計算量 DoS) — @keystatic/core 由来分は削除済みだが、
  # Astro 7 で @astrojs/internal-helpers 経由で引き続きツリーに存在するため維持。
  # GHSA-5p4m-2wfm-xmqj (js-yaml <4.3.1) — !!omap 解決の二次計算量 DoS。同じ経路で 4.3.0 が
  # 残っていたため下限を 4.3.1 へ引き上げた (2026-08-09)。
  "js-yaml@>=4.0.0 <4.3.1": ">=4.3.1 <5"
  # osv-scanner 検出分 (2026-07-27)。いずれも devDependency 経由 (claude-agent-sdk / vercel adapter / rss)。
  # GHSA-frvp-7c67-39w9 (@hono/node-server DoS) — @anthropic-ai/claude-agent-sdk 経由。
  "@hono/node-server@<2.0.5": ">=2.0.5"
  # GHSA-mh99-v99m-4gvg (brace-expansion ReDoS) — @astrojs/vercel>@vercel/nft 経由。
  # GHSA-rgw5-rvv9-x895 (brace-expansion <5.0.9) — 同じ経路で 5.0.8 が残っていたため
  # 下限を 5.0.9 へ引き上げた (2026-08-09)。
  "brace-expansion@<5.0.9": ">=5.0.9 <6"
  # GHSA-v2hh-gcrm-f6hx (fast-uri) — ajv 経由 (claude-agent-sdk の MCP SDK 等)。
  # GHSA-7p8r-x3mc-p8w7 (fast-uri <3.1.5) — backslash authority introducer による host confusion。
  "fast-uri@<3.1.5": ">=3.1.5 <4"
  # GHSA-8r6m-32jq-jx6q (fast-xml-parser) — @astrojs/rss 経由。
  "fast-xml-parser@<5.10.1": ">=5.10.1 <6"
  # GHSA-2v37-7h3g-55p8 (nanoid <3.3.17) — customAlphabet / customRandom に size=0 を渡すと
  # 無限ループする。postcss (ソースマップ用 ID 生成、size は固定) > vite 経由。
  # advisory の影響範囲が 2026-08-08 に 3.3.16 まで拡大されたため追加 (2026-08-09)。
  "nanoid@>=3.0.0 <3.3.17": ">=3.3.17 <4"

# keystatic 関連のルール群 (ADR 0016 で Keystatic を Sveltia へ移行済み):
# - peerDependencyRules.allowedVersions["@keystatic/astro>astro"] → 削除
# - patchedDependencies["@keystatic/core"]                        → 削除

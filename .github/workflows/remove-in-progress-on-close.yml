# 各リポジトリの .github/workflows/remove-in-progress-on-close.yml に配置する呼び出し元。
name: Remove in-progress label on close

on:
  pull_request:
    types: [closed]
  issues:
    types: [closed]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to strip the in-progress label from
        required: true
        type: number

permissions:
  issues: write
  pull-requests: read

jobs:
  remove-label:
    # SHA は keroway/.github の main（2026-09-02 時点でレビュー済み、v1 相当）に固定。更新手順は
    # docs/reusable-workflow-sha-pinning.md を参照。
    uses: keroway/.github/.github/workflows/reusable-remove-in-progress-on-close.yml@f46116661fa12e4ff3911c40970cf0f8510e9823 # v1.0.0
    with:
      issue_number: ${{ github.event_name == 'workflow_dispatch' && fromJSON(inputs.issue_number) || 0 }}
